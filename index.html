<script>
/* Cooley Brothers Leadership Training — shared storage
   Saves to the browser (localStorage). No server needed for the MVP.
   Learner app and supervisor dashboard both read/write this same store. */

const CBL_KEY = 'cbl.v1';

function cblLoad() {
  try {
    const raw = localStorage.getItem(CBL_KEY);
    if (!raw) return { learners: {}, activeId: null };
    const d = JSON.parse(raw);
    if (!d.learners) d.learners = {};
    return d;
  } catch (e) {
    console.warn('store read failed', e);
    return { learners: {}, activeId: null };
  }
}

function cblSave(d) {
  try { localStorage.setItem(CBL_KEY, JSON.stringify(d)); }
  catch (e) { console.warn('store write failed', e); }
}

function cblNewLearner(name, supervisor, lang) {
  const id = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  return {
    id, name: name.trim(), supervisor: (supervisor || '').trim(),
    lang: lang || 'en',
    startDate: new Date().toISOString(),
    lessons: {},            // { "1": {status, answers:{}, videoWatched, completedAt, emailedAt} }
    tests: {},              // { disc:isoDate, p16:isoDate }
    coach: {},              // { "1": {note, score, at} }
    practicum: {},          // { "0": true, ... }  Lesson 6 sign-off
    next10: '',
    next10History: [],
    readiness: 'no',        // no | almost | yes
    completedAt: null
  };
}

function cblLesson(rec, id) {
  if (!rec.lessons[id]) rec.lessons[id] = { status: 'not_started', answers: {}, videoWatched: false, completedAt: null, emailedAt: null };
  return rec.lessons[id];
}

/* how many lessons are complete */
function cblDoneCount(rec) {
  return Object.values(rec.lessons || {}).filter(l => l.status === 'complete').length;
}

/* lowest lesson number not complete (1..6), or null when all done */
function cblCurrentLesson(rec, total) {
  for (let i = 1; i <= total; i++) {
    const l = rec.lessons[i];
    if (!l || l.status !== 'complete') return i;
  }
  return null;
}

function cblFmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

</script>

<script>
/* ==========================================================================
   Cooley Brothers Leadership Training — learner app
   ========================================================================== */
let DB   = cblLoad();
let REC  = DB.activeId ? DB.learners[DB.activeId] : null;
let LANG = REC ? REC.lang : (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
let VIEW = { name: 'home', lesson: null, step: 0 };
const TOTAL = LESSONS.length;

const T   = () => UI[LANG];
const t   = (o) => !o ? '' : (typeof o === 'string' ? o : (o[LANG] || o.en || ''));
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function persist() { if (REC) { DB.learners[REC.id] = REC; DB.activeId = REC.id; } cblSave(DB); }

function setLang(l) {
  LANG = l;
  if (REC) { REC.lang = l; persist(); }
  render();
}

function go(name, lesson, step) {
  VIEW = { name, lesson: lesson ?? VIEW.lesson, step: step ?? 0 };
  window.scrollTo(0, 0);
  render();
}

/* ---------- small builders ------------------------------------------------ */
const lines = (arr, cls) =>
  `<div class="lines ${cls||''}">` + (arr||[]).map(x => `<p>${esc(x)}</p>`).join('') + `</div>`;

function videoBlock(lesson) {
  const v = lesson.video || {};
  const L = cblLesson(REC, lesson.id);
  const title = t(v.title);
  const note  = t(v.note);
  const noteHtml = note
    ? `<div class="esnote"><span class="lbl">${esc(T().spanishNote)}</span>${esc(note)}</div>` : '';

  if (!v.id) {
    return `<div class="videosoon">
        <strong>${esc(T().videoSoon)}</strong>
        <span>${esc(T().videoSoonSub)}</span>
      </div>${title ? `<p class="videotitle">${esc(title)}</p>` : ''}${noteHtml}`;
  }
  if (L.videoWatched && VIEW.playing === v.id) {
    return `<div class="video"><iframe
        src="https://www.youtube-nocookie.com/embed/${esc(v.id)}?autoplay=1&rel=0"
        allow="accelerometer;autoplay;encrypted-media;picture-in-picture" allowfullscreen
        title="${esc(title)}"></iframe></div>
      ${title ? `<p class="videotitle">${esc(title)}</p>` : ''}
      <a class="btn quiet" target="_blank" rel="noopener"
         href="https://www.youtube.com/watch?v=${esc(v.id)}">${esc(T().openYouTube)} ↗</a>
      ${noteHtml}`;
  }
  return `<button class="video" onclick="playVideo(${lesson.id},'${esc(v.id)}')">
      <img src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="" loading="lazy">
      <span class="play"><span class="circle"></span><span>${esc(T().playBtn)}</span></span>
    </button>
    ${title ? `<p class="videotitle">${esc(title)}</p>` : ''}${noteHtml}`;
}

function playVideo(lessonId, vid) {
  cblLesson(REC, lessonId).videoWatched = true;
  VIEW.playing = vid;
  persist(); render();
}

function block(b, lesson, si, bi) {
  switch (b.t) {
    case 'p':  return lines(b[LANG] || b.en);
    case 'ul': return `<ul class="plain">${(b[LANG]||b.en).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    case 'ol': return `<ol class="plain">${(b[LANG]||b.en).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
    case 'ex': return boxOf('ex',   T().examples, b[LANG]||b.en);
    case 'bad':return boxOf('bad',  T().dontSay,  b[LANG]||b.en);
    case 'good':return boxOf('good',T().doSay,    b[LANG]||b.en);
    case 'tool': return `<div class="tool">
        <p class="toolname">${esc(t(b.name))}</p>
        ${b.steps.map(s=>`<div class="toolstep">
            <div class="w">${esc(t(s.word))}</div>
            <div class="l">${esc(t(s.line))}</div></div>`).join('')}
      </div>`;
    case 'link': return linkBlock(b);
    case 'q':    return qBlock(b, lesson, si, bi);
    default:     return '';
  }
}
const boxOf = (cls, label, arr) =>
  `<div class="box ${cls}"><p class="lbl">${esc(label)}</p>${(arr||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div>`;

function linkBlock(b) {
  const url  = typeof b.url === 'string' ? b.url : t(b.url);
  const done = REC.tests[b.key];
  return `<a class="btn orange" href="${esc(url)}" target="_blank" rel="noopener"
             onclick="markTest('${esc(b.key)}')">${esc(t(b.label))} ↗</a>
    ${done
      ? `<p class="small" style="text-align:center;color:var(--ok);font-weight:800;margin-top:10px">
           ✓ ${esc(T().testDone)} — ${esc(cblFmtDate(done))}</p>`
      : `<button class="btn ghost" onclick="markTest('${esc(b.key)}',1)">${esc(T().markTestDone)}</button>`}`;
}
function markTest(key, rerender) {
  if (!REC.tests[key]) REC.tests[key] = new Date().toISOString();
  persist(); if (rerender) render();
}

/* answer boxes — key is  lessonId.stepIndex.blockIndex.n  */
function qBlock(b, lesson, si, bi) {
  const n = b.count || 1;
  const L = cblLesson(REC, lesson.id);
  let html = `<div class="qblock"><p class="qtext">${esc(b[LANG] || b.en)}</p>`;
  for (let i = 0; i < n; i++) {
    const key = `${lesson.id}.${si}.${bi}.${i}`;
    const val = L.answers[key] || '';
    html += `<textarea class="${n>1?'short':''}" data-k="${key}"
        placeholder="${esc(n>1 ? (i+1)+'.' : T().typeHere)}"
        oninput="saveAns(${lesson.id},'${key}',this.value,this)">${esc(val)}</textarea>`;
  }
  html += `<p class="savedtag" id="s_${lesson.id}_${si}_${bi}">${esc(T().saved)} ✓</p></div>`;
  return html;
}

let saveTimer = null;
function saveAns(lessonId, key, val, el) {
  cblLesson(REC, lessonId).answers[key] = val;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    persist();
    const tag = el.parentElement.querySelector('.savedtag');
    if (tag) { tag.classList.add('show'); setTimeout(()=>tag.classList.remove('show'), 1400); }
  }, 400);
}

/* every answer box in the lesson filled? */
function lessonAnswered(lesson) {
  const L = cblLesson(REC, lesson.id);
  let ok = true;
  lesson.steps.forEach((s, si) => s.blocks.forEach((b, bi) => {
    if (b.t !== 'q') return;
    for (let i = 0; i < (b.count || 1); i++) {
      const v = L.answers[`${lesson.id}.${si}.${bi}.${i}`];
      if (!v || !v.trim()) ok = false;
    }
  }));
  return ok;
}

/* ---------- screens ------------------------------------------------------- */
function screenStart() {
  return `
  <h1>${esc(T().courseTitle)}</h1>
  <p class="sub">${esc(CONFIG.companyName)} — ${esc(T().tagline)}</p>

  <div class="card">
    <p class="eyebrow">${esc(T().pickLanguage)}</p>
    <div class="langpick">
      <button class="${LANG==='en'?'on':''}" onclick="setLang('en')">English</button>
      <button class="${LANG==='es'?'on':''}" onclick="setLang('es')">Español</button>
    </div>

    <label class="fld" for="nm">${esc(T().startName)}</label>
    <input type="text" id="nm" autocomplete="name" placeholder="${esc(T().namePlaceholder)}">

    <label class="fld" for="sv">${esc(T().startSupervisor)}</label>
    <input type="text" id="sv" placeholder="${esc(T().supervisorPlaceholder)}">

    <button class="btn" onclick="createLearner()">${esc(T().startBtn)}</button>
  </div>

  <div class="card flat">
    ${lines(START_HERE.why[LANG])}
  </div>
  <p style="text-align:center"><a class="small muted" href="#supervisor" onclick="showCoach();return false">${esc(T().coachLink)} →</a></p>`;
}

function createLearner() {
  const nm = document.getElementById('nm').value.trim();
  const sv = document.getElementById('sv').value.trim();
  if (!nm) { document.getElementById('nm').focus(); return; }
  REC = cblNewLearner(nm, sv, LANG);
  DB.learners[REC.id] = REC; DB.activeId = REC.id;
  persist(); go('home');
}

function screenHome() {
  const doneN   = cblDoneCount(REC);
  const current = cblCurrentLesson(REC, TOTAL);
  const pct     = Math.round(doneN / TOTAL * 100);
  const allDone = current === null;

  const rows = LESSONS.map(l => {
    const st     = REC.lessons[l.id];
    const done   = st && st.status === 'complete';
    const locked = l.id > 1 && !(REC.lessons[l.id-1] && REC.lessons[l.id-1].status === 'complete');
    return `<button class="lessonrow ${done?'done':''} ${l.id===current?'current':''}"
        ${locked?'disabled':''} onclick="go('lesson',${l.id},0)">
        <span class="num">${done ? '✓' : l.id}</span>
        <span class="ttl">${esc(t(l.name))}
          <small>${esc(locked ? T().locked : t(l.question))}</small></span>
        <span class="chev">${locked ? '🔒' : '›'}</span>
      </button>`;
  }).join('');

  const focus = `<div class="focus">
      <p class="eyebrow">${esc(T().next10Title)}</p>
      <p>${REC.next10 ? esc(REC.next10) : `<span class="muted" style="font-weight:500">${esc(T().next10Empty)}</span>`}</p>
    </div>`;

  const banner = allDone
    ? `<div class="card" style="background:var(--ok-bg);border-color:#bde3c9">
         <h2 style="margin:0 0 6px">${esc(T().finishedAll)}</h2>
         <p class="muted" style="margin:0">${esc(T().finishedAllSub)}</p></div>`
    : '';

  return `
  <p class="hello">${esc(T().welcome)}</p>
  <h1 style="margin-top:2px">${esc(REC.name)}</h1>
  <div class="bar"><span style="width:${pct}%"></span></div>
  <p class="progressline">${esc(allDone ? T().finishedAll : T().lessonOf(current, TOTAL))}</p>
  ${focus}
  ${banner}
  <h2>${esc(T().yourLessons)}</h2>
  <div class="lessonlist">${rows}</div>
  <p style="text-align:center;margin-top:26px">
    <a class="small muted" href="#" onclick="switchLearner();return false">${esc(T().switchUser)}</a>
    &nbsp;·&nbsp;
    <a class="small muted" href="#supervisor" onclick="showCoach();return false">${esc(T().coachLink)} →</a>
  </p>`;
}

function stickyHome() {
  const current = cblCurrentLesson(REC, TOTAL);
  if (current === null) return '';
  const started = REC.lessons[current] && REC.lessons[current].status === 'in_progress';
  return `<div class="sticky"><div class="inner">
      <button class="btn" onclick="go('lesson',${current},0)">
        ${esc(started ? T().continueBtn : T().startLessonBtn)}
      </button></div></div>`;
}

function switchLearner() {
  DB.activeId = null; cblSave(DB); REC = null; go('start');
}

/* ---- lesson: step 0 = intro, 1..n = steps, n+1 = before you finish -------- */
function screenLesson() {
  const l    = LESSONS.find(x => x.id === VIEW.lesson);
  const L    = cblLesson(REC, l.id);
  if (L.status === 'not_started') { L.status = 'in_progress'; persist(); }
  const last = l.steps.length + 1;
  const s    = VIEW.step;

  const dots = `<div class="stepdots">` +
    Array.from({length: last + 1}, (_, i) =>
      `<i class="${i < s ? 'done' : i === s ? 'now' : ''}"></i>`).join('') + `</div>`;

  let body = '';
  if (s === 0) {
    body = `${dots}
      <p class="eyebrow">${esc(T().lessonOf(l.id, TOTAL))}</p>
      <h1>${esc(t(l.name))}</h1>
      <p class="sub">${esc(t(l.question))}</p>
      <div class="card"><p class="eyebrow">${esc(T().bigIdea)}</p>${lines(l.bigIdea[LANG], 'big')}</div>
      <div class="card flat"><p class="eyebrow">${esc(T().why)}</p>${lines(l.why[LANG])}</div>
      ${l.assignment ? `<div class="focus"><p class="eyebrow">${esc(T().practiceLabel)}</p>
        <p style="font-size:20px">${esc(t(l.assignment))}</p></div>` : ''}`;
  } else if (s <= l.steps.length) {
    const st = l.steps[s-1];
    const si = s - 1;
    body = `${dots}
      <p class="stepno">${esc(T().step)} ${st.n} ${esc(T().of)} ${l.steps.length}</p>
      <h1>${esc(t(st.title))}</h1>
      ${st.n === 1 ? videoBlock(l) : ''}
      ${st.blocks.map((b, bi) => block(b, l, si, bi)).join('')}`;
  } else {
    body = `${dots}
      <h1>${esc(T().beforeFinish)}</h1>
      <p class="sub">${esc(T().beforeFinishSub)}</p>
      <div class="card"><ul class="check">
        ${l.checklist[LANG].map(x => `<li>${esc(x)}</li>`).join('')}
      </ul></div>
      ${l.sendNote ? `<div class="esnote">${l.sendNote[LANG].map(x=>esc(x)).join('<br>')}</div>` : ''}
      <div class="card" style="background:var(--navy);color:#fff;border:0">
        <p class="eyebrow" style="color:#ffd7b0">${esc(T().remember)}</p>
        ${(l.remember[LANG]).map(x=>`<p style="font-size:21px;font-weight:700;margin:0 0 6px">${esc(x)}</p>`).join('')}
      </div>
      <details class="lsn"><summary>${esc(T().spanishHelp)} / Ayuda en español</summary>
        <div class="body">${l.spanishHelp.map(p =>
          `<p class="small" style="margin:0 0 8px"><strong>${esc(p.en)}</strong> = ${esc(p.es)}</p>`).join('')}
        </div></details>`;
  }
  return body;
}

function stickyLesson() {
  const l = LESSONS.find(x => x.id === VIEW.lesson);
  const last = l.steps.length + 1;
  const s = VIEW.step;
  const back = s === 0
    ? `<button class="btn quiet" style="flex:0 0 34%" onclick="go('home')">${esc(T().home)}</button>`
    : `<button class="btn quiet" style="flex:0 0 34%" onclick="go('lesson',${l.id},${s-1})">${esc(T().back)}</button>`;

  if (s < last) {
    return `<div class="sticky"><div class="inner"><div class="btn-row">
        ${back}
        <button class="btn" style="flex:1" onclick="go('lesson',${l.id},${s+1})">${esc(T().next)} ›</button>
      </div></div></div>`;
  }
  const ready = lessonAnswered(l);
  return `<div class="sticky"><div class="inner">
      ${ready ? '' : `<p class="hint">${esc(T().needAnswer)}</p>`}
      <div class="btn-row">
        ${back}
        <button class="btn green" style="flex:1" ${ready?'':'disabled'}
          onclick="completeLesson(${l.id})">${esc(T().completeBtn)}</button>
      </div></div></div>`;
}

function completeLesson(id) {
  const L = cblLesson(REC, id);
  L.status = 'complete';
  L.completedAt = new Date().toISOString();
  if (cblDoneCount(REC) === TOTAL && !REC.completedAt) REC.completedAt = new Date().toISOString();
  persist();
  go('done', id);
}

/* ---- done + check in with Rob -------------------------------------------- */
function mailtoRob(lessonId) {
  const l = LESSONS.find(x => x.id === lessonId);
  const L = cblLesson(REC, lessonId);
  const subject = `Leadership Training — Lesson ${lessonId} Complete`;

  const answers = [];
  l.steps.forEach((st, si) => st.blocks.forEach((b, bi) => {
    if (b.t !== 'q') return;
    const q = b.en;
    const vals = [];
    for (let i = 0; i < (b.count || 1); i++) {
      const v = L.answers[`${lessonId}.${si}.${bi}.${i}`];
      if (v && v.trim()) vals.push(((b.count||1) > 1 ? (i+1) + '. ' : '') + v.trim());
    }
    if (vals.length) answers.push(q + '\n' + vals.join('\n'));
  }));

  const body =
`Hi Rob,

I finished Lesson ${lessonId}: ${l.name.en}.

My answers:

${answers.join('\n\n')}

Thank you.
${REC.name}`;

  let url = `mailto:${CONFIG.robEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (CONFIG.ccEmail) url += `&cc=${encodeURIComponent(CONFIG.ccEmail)}`;
  return url;
}

function screenDone() {
  const id   = VIEW.lesson;
  const l    = LESSONS.find(x => x.id === id);
  const L    = cblLesson(REC, id);
  const next = LESSONS.find(x => x.id === id + 1);
  return `
  <div class="done-hero">
    <div class="mark">✓</div>
    <h1>${esc(T().goodJob)}</h1>
    <p>${esc(T().checkIn)}</p>
  </div>
  <div class="card flat">
    <p class="small muted" style="margin:0">${esc(T().lessonOf(id, TOTAL))} — ${esc(t(l.name))}</p>
  </div>
  <a class="btn orange" href="${esc(mailtoRob(id))}" onclick="markEmailed(${id})">
    ✉ ${esc(T().emailRob)}</a>
  ${L.emailedAt
    ? `<p class="small" style="text-align:center;color:var(--ok);font-weight:800;margin-top:10px">
         ✓ ${esc(T().emailedRob)}</p>`
    : `<button class="btn ghost" onclick="markEmailed(${id},1)">${esc(T().emailedRob)}</button>`}
  <div style="height:20px"></div>
  ${next
    ? `<button class="btn" onclick="go('lesson',${next.id},0)">${esc(T().nextLesson)}: ${esc(t(next.name))} ›</button>`
    : `<div class="card" style="background:var(--ok-bg);border-color:#bde3c9">
         <h2 style="margin:0 0 6px">${esc(T().finishedAll)}</h2>
         <p class="muted" style="margin:0">${esc(T().finishedAllSub)}</p></div>`}
  <button class="btn quiet" onclick="go('home')">${esc(T().backHome)}</button>`;
}

function markEmailed(id, rerender) {
  const L = cblLesson(REC, id);
  if (!L.emailedAt) L.emailedAt = new Date().toISOString();
  persist(); if (rerender) render(); else setTimeout(render, 600);
}

/* ---------- render -------------------------------------------------------- */
function render() {
  document.documentElement.lang = LANG;
  document.getElementById('langEn').className = LANG === 'en' ? 'on' : '';
  document.getElementById('langEs').className = LANG === 'es' ? 'on' : '';
  document.getElementById('brand').textContent =
    CONFIG.companyName + ' — ' + T().courseTitle;

  const app = document.getElementById('app');
  const stk = document.getElementById('sticky');
  const homeBtn = document.getElementById('homeBtn');

  if (!REC) { VIEW.name = 'start'; }
  homeBtn.style.display = (REC && VIEW.name !== 'home' && VIEW.name !== 'start') ? '' : 'none';

  if (VIEW.name === 'start')       { app.innerHTML = screenStart();  stk.innerHTML = ''; }
  else if (VIEW.name === 'lesson') { app.innerHTML = screenLesson(); stk.innerHTML = stickyLesson(); }
  else if (VIEW.name === 'done')   { app.innerHTML = screenDone();   stk.innerHTML = ''; }
  else                             { app.innerHTML = screenHome();   stk.innerHTML = stickyHome(); }
}

render();
</script>

<script>
/* ==========================================================================
   Supervisor / manager dashboard
   More detail than the learner view — this is for Rob and the supervisors.
   ========================================================================== */
let CDB    = cblLoad();
let UNLOCKED = sessionStorage.getItem('cbl.coach') === '1';
let OPEN  = null;   // learner id being viewed
const CTOTAL = LESSONS.length;

const cesc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function csave() { cblSave(CDB); }
function crec(id) { return CDB.learners[id]; }

/* ---------- PIN ----------------------------------------------------------- */
function screenPin() {
  return `<div class="card" style="max-width:420px;margin:60px auto">
    <h2 style="margin-top:0">Supervisor access</h2>
    <p class="muted small">Enter the supervisor PIN.</p>
    <input type="password" inputmode="numeric" id="pin" placeholder="PIN"
           onkeydown="if(event.key==='Enter')tryPin()">
    <button class="btn" onclick="tryPin()">OPEN DASHBOARD</button>
    <p class="small muted" id="pinerr" style="text-align:center;color:var(--bad)"></p>
  </div>`;
}
function tryPin() {
  const v = document.getElementById('pin').value.trim();
  if (v === CONFIG.coachPin) {
    UNLOCKED = true; sessionStorage.setItem('cbl.coach','1'); crender();
  } else {
    document.getElementById('pinerr').textContent = 'Wrong PIN.';
  }
}

/* ---------- roster -------------------------------------------------------- */
function screenList() {
  const ls = Object.values(CDB.learners)
    .sort((a,b) => a.name.localeCompare(b.name));

  const body = ls.length ? `
    <table class="grid">
      <thead><tr>
        <th>Name</th><th>Supervisor</th><th>Current lesson</th>
        <th>Done</th><th>Next 10%</th><th>Ready to lead</th>
      </tr></thead>
      <tbody>${ls.map(r => {
        const cur = cblCurrentLesson(r, CTOTAL);
        const l   = cur ? LESSONS.find(x=>x.id===cur) : null;
        return `<tr class="clickable" onclick="open_('${r.id}')">
          <td><strong>${cesc(r.name)}</strong><br><span class="small muted">Started ${cesc(cblFmtDate(r.startDate))} · ${r.lang === 'es' ? 'Español' : 'English'}</span></td>
          <td>${cesc(r.supervisor || '—')}</td>
          <td>${l ? cesc(cur + '. ' + l.name.en) : '<span class="pill done">All 6 done</span>'}</td>
          <td><strong>${cblDoneCount(r)}</strong> / ${CTOTAL}</td>
          <td class="small">${cesc(r.next10 || '—')}</td>
          <td><span class="pill ${r.readiness}">${r.readiness === 'no' ? 'No' : r.readiness === 'almost' ? 'Almost' : 'Yes'}</span></td>
        </tr>`;
      }).join('')}</tbody>
    </table>` : `<div class="empty">No learners yet on this device.<br>
      <span class="small">A learner appears here after they start the course in this browser,
      or after you import their file below.</span></div>`;

  return `<h1>Learners</h1>
    ${body}
    <div class="toolbar">
      <button class="solid" onclick="exportAll()">Export all (backup)</button>
      <button onclick="importPrompt()">Import a learner file</button>
      <button onclick="showLearner()">Open the course</button>
    </div>
    <p class="small muted">This dashboard reads what is saved in <strong>this browser</strong>.
      Each painter's phone keeps its own copy. Use Export / Import to move a learner
      between devices, or ask me to connect a shared database.</p>`;
}

function open_(id) { OPEN = id; window.scrollTo(0,0); crender(); }

/* ---------- learner detail ------------------------------------------------ */
function screenDetail() {
  const r = crec(OPEN);
  if (!r) { OPEN = null; return screenList(); }
  const cur = cblCurrentLesson(r, CTOTAL);

  const lessons = LESSONS.map(l => {
    const st = r.lessons[l.id] || {};
    const c  = r.coach[l.id] || {};
    const answers = [];
    l.steps.forEach((s, si) => s.blocks.forEach((b, bi) => {
      if (b.t !== 'q') return;
      const vals = [];
      for (let i = 0; i < (b.count||1); i++) {
        const v = (st.answers||{})[`${l.id}.${si}.${bi}.${i}`];
        if (v && v.trim()) vals.push(((b.count||1)>1 ? (i+1)+'. ' : '') + v.trim());
      }
      if (vals.length) answers.push({ q: b.en, a: vals.join('\n') });
    }));

    const status = st.status === 'complete'
      ? `<span class="pill done">Complete ${cesc(cblFmtDate(st.completedAt))}</span>`
      : st.status === 'in_progress' ? `<span class="pill almost">In progress</span>`
      : `<span class="pill no">Not started</span>`;

    const practicum = l.practicum ? `
      <h3 style="font-size:17px;margin:20px 0 6px">Final practicum — supervisor confirms</h3>
      <p class="small muted" style="margin:0 0 8px">Lesson 6 is not complete because he watched a video.
        He must lead one small part of a real job.</p>
      ${l.practicum.map((p,i) => `<label class="pcheck">
          <input type="checkbox" ${r.practicum[i] ? 'checked':''}
                 onchange="setPracticum(${i},this.checked)">
          <span>${cesc(p.en)}</span></label>`).join('')}` : '';

    return `<details class="lsn" ${l.id === cur ? 'open':''}>
      <summary>${l.id}. ${cesc(l.name.en)} &nbsp; ${status}</summary>
      <div class="body">
        <p class="small muted" style="margin:0 0 4px"><strong>Field assignment:</strong>
          ${cesc(l.assignment ? l.assignment.en : '—')}</p>
        <p class="small muted" style="margin:0 0 12px"><strong>Video watched:</strong>
          ${st.videoWatched ? 'Yes' : 'No'} &nbsp;·&nbsp;
          <strong>Emailed Rob:</strong> ${st.emailedAt ? cblFmtDate(st.emailedAt) : 'No'}</p>

        ${answers.length
          ? answers.map(a => `<div class="answerbox"><span class="q">${cesc(a.q)}</span>${cesc(a.a)}</div>`).join('')
          : '<p class="small muted">No answers yet.</p>'}

        ${practicum}

        <h3 style="font-size:17px;margin:20px 0 6px">Supervisor note</h3>
        <textarea class="coachnote" placeholder="What did you see on the job?"
          onchange="setNote(${l.id}, this.value)">${cesc(c.note || '')}</textarea>

        <h3 style="font-size:17px;margin:16px 0 6px">Score (1–5) — only if useful</h3>
        <div class="scorebtns">
          ${[1,2,3,4,5].map(n => `<button class="${c.score===n?'on':''}"
              onclick="setScore(${l.id},${n})">${n}</button>`).join('')}
          <button class="${!c.score?'on':''}" onclick="setScore(${l.id},0)">—</button>
        </div>
      </div></details>`;
  }).join('');

  return `
  <p class="small"><a href="#" onclick="OPEN=null;crender();return false">← All learners</a></p>
  <h1 style="margin-bottom:2px">${cesc(r.name)}</h1>
  <p class="muted">Supervisor: ${cesc(r.supervisor || '—')} ·
     Started ${cesc(cblFmtDate(r.startDate))} ·
     Language: ${r.lang === 'es' ? 'Español' : 'English'} ·
     <strong>${cblDoneCount(r)}/${CTOTAL} lessons complete</strong></p>

  <div class="card">
    <p class="eyebrow">The Next 10% — one focus at a time</p>
    <textarea class="coachnote" id="n10" placeholder="Example: Speak slower when you give directions."
      >${cesc(r.next10 || '')}</textarea>
    <button class="btn" style="min-height:52px;font-size:17px" onclick="setNext10()">SAVE THE NEXT 10%</button>
    ${r.next10History && r.next10History.length ? `
      <p class="small muted" style="margin-top:12px"><strong>Past focus:</strong></p>
      ${r.next10History.map(h => `<p class="small muted" style="margin:0">${cesc(cblFmtDate(h.at))} — ${cesc(h.text)}</p>`).join('')}
    ` : ''}
  </div>

  <div class="card">
    <p class="eyebrow">Assessments</p>
    <p>DISC: ${r.tests.disc ? `<span class="pill done">Done ${cesc(cblFmtDate(r.tests.disc))}</span>` : '<span class="pill no">Not done</span>'}</p>
    <p>16Personalities: ${r.tests.p16 ? `<span class="pill done">Done ${cesc(cblFmtDate(r.tests.p16))}</span>` : '<span class="pill no">Not done</span>'}</p>
    <p class="small muted">Result files come to Rob by email. The painter marks them done here.</p>
  </div>

  <div class="card">
    <p class="eyebrow">Ready for more leadership?</p>
    <p class="small muted" style="margin:0 0 8px">Decide this from what you saw on the job.
      Do not promote anyone because the course says 100%.</p>
    <div class="readybtns">
      ${['no','almost','yes'].map(v => `<button class="${r.readiness===v?'on':''}"
          onclick="setReady('${v}')">${v}</button>`).join('')}
    </div>
  </div>

  <h2>Lessons and answers</h2>
  ${lessons}

  <div class="toolbar">
    <button class="solid" onclick="exportOne('${r.id}')">Export ${cesc(r.name)}</button>
    <button onclick="copySummary('${r.id}')">Copy summary</button>
    <button onclick="removeLearner('${r.id}')">Delete learner</button>
  </div>`;
}

/* ---------- mutations ----------------------------------------------------- */
function setNote(lid, v) {
  const r = crec(OPEN); if (!r.coach[lid]) r.coach[lid] = {};
  r.coach[lid].note = v; r.coach[lid].at = new Date().toISOString(); csave();
}
function setScore(lid, n) {
  const r = crec(OPEN); if (!r.coach[lid]) r.coach[lid] = {};
  r.coach[lid].score = n || null; csave(); crender();
}
function setNext10() {
  const r = crec(OPEN);
  const v = document.getElementById('n10').value.trim();
  if (r.next10 && r.next10 !== v) {
    r.next10History = r.next10History || [];
    r.next10History.unshift({ text: r.next10, at: new Date().toISOString() });
  }
  r.next10 = v; csave(); crender();
}
function setReady(v) { crec(OPEN).readiness = v; csave(); crender(); }
function setPracticum(i, on) { crec(OPEN).practicum[i] = on; csave(); }

function removeLearner(id) {
  const r = crec(id);
  if (!confirm(`Delete ${r.name} and all of their answers? This cannot be undone.`)) return;
  delete CDB.learners[id];
  if (CDB.activeId === id) CDB.activeId = null;
  OPEN = null; csave(); crender();
}

/* ---------- export / import ---------------------------------------------- */
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportAll() {
  download('cooley-leadership-backup.json', JSON.stringify(CDB, null, 2));
}
function exportOne(id) {
  const r = crec(id);
  download(`cooley-${r.name.replace(/\W+/g,'-').toLowerCase()}.json`, JSON.stringify(r, null, 2));
}
function importPrompt() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (d.learners) { Object.values(d.learners).forEach(l => CDB.learners[l.id] = l); }
        else if (d.id && d.name) { CDB.learners[d.id] = d; }
        else { alert('That file does not look like a learner file.'); return; }
        csave(); crender();
      } catch (e) { alert('Could not read that file.'); }
    };
    fr.readAsText(f);
  };
  inp.click();
}
function copySummary(id) {
  const r = crec(id);
  const cur = cblCurrentLesson(r, CTOTAL);
  let out = `${r.name} — Cooley Brothers Leadership Training\n`;
  out += `Supervisor: ${r.supervisor || '—'}\nStarted: ${cblFmtDate(r.startDate)}\n`;
  out += `Progress: ${cblDoneCount(r)}/${CTOTAL} lessons\n`;
  out += `Current: ${cur ? cur + '. ' + LESSONS.find(x=>x.id===cur).name.en : 'All lessons done'}\n`;
  out += `Next 10%: ${r.next10 || '—'}\nReady to lead: ${r.readiness}\n\n`;
  LESSONS.forEach(l => {
    const st = r.lessons[l.id]; if (!st || st.status === 'not_started') return;
    out += `--- Lesson ${l.id}: ${l.name.en} (${st.status}${st.completedAt ? ', ' + cblFmtDate(st.completedAt) : ''})\n`;
    l.steps.forEach((s, si) => s.blocks.forEach((b, bi) => {
      if (b.t !== 'q') return;
      for (let i = 0; i < (b.count||1); i++) {
        const v = (st.answers||{})[`${l.id}.${si}.${bi}.${i}`];
        if (v && v.trim()) out += `Q: ${b.en}\nA: ${v.trim()}\n`;
      }
    }));
    const c = r.coach[l.id];
    if (c && (c.note || c.score)) out += `Supervisor: ${c.note || ''}${c.score ? ' [score ' + c.score + '/5]' : ''}\n`;
    out += '\n';
  });
  navigator.clipboard.writeText(out).then(
    () => alert('Summary copied. Paste it into an email.'),
    () => prompt('Copy this:', out));
}

/* ---------- crender -------------------------------------------------------- */
function crender() {
  CDB = cblLoad();
  const app = document.getElementById('capp');
  if (!UNLOCKED)  { app.innerHTML = screenPin(); return; }
  app.innerHTML = OPEN ? screenDetail() : screenList();
}
crender();
</script>

<script>

/* ---- which side of the app are we showing? ---- */
function showCoach() {
  document.getElementById('learnerApp').style.display = 'none';
  document.getElementById('coachApp').style.display   = '';
  location.hash = 'supervisor';
  window.scrollTo(0, 0);
  crender();
}
function showLearner() {
  document.getElementById('coachApp').style.display   = 'none';
  document.getElementById('learnerApp').style.display = '';
  if (location.hash) history.replaceState(null, '', location.pathname);
  window.scrollTo(0, 0);
  render();
}
(location.hash === '#supervisor' ? showCoach : showLearner)();

</script>
</body>
</html>
